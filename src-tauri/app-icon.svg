<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173540"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
  </defs>

  <!-- carré arrondi -->
  <rect width="1024" height="1024" rx="230" fill="url(#fond)"/>

  <!-- anneau « pièce » discret -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#a3e635" stroke-opacity="0.18" stroke-width="26"/>

  <!-- euro (vectoriel, sans police) -->
  <g fill="none" stroke="#a3e635" stroke-width="80" stroke-linecap="round">
    <!-- le « C » ouvert à droite -->
    <path d="M 680.9 647 A 210 210 0 1 1 680.9 377"/>
    <!-- les deux barres -->
    <path d="M 250 470 H 585"/>
    <path d="M 250 560 H 545"/>
  </g>
</svg>
