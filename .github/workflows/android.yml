name: Build Android APK

# APK de debug pour tester (branche dev). La release signée est dans release.yml.
on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Version du NDK Android installée plus bas ; NDK_HOME est ce que Tauri lit.
      NDK_VERSION: "27.2.12479018"

    steps:
      # Le runner n'a qu'~14 Go libres : on supprime des outils préinstallés
      # inutiles pour récupérer de la place avant le build Android + Rust.
      - name: Libérer de l'espace disque
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Récupérer le code
        uses: actions/checkout@v4

      # --- Frontend (Node) ---
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances npm
        run: npm ci

      # --- Java (pour Gradle) ---
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # --- SDK + NDK Android ---
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer le NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # --- Rust + cible Android (arm64 uniquement = ~tous les téléphones) ---
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --- Génération du projet Android puis build de l'APK debug ---
      - name: Initialiser le projet Android
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: Construire l'APK (debug, arm64)
        run: npm run tauri android build -- --debug --apk --target aarch64
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # --- Publication de l'APK en artifact téléchargeable ---
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-budget-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
